[project]
name = "folio-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]
[build-system]
requires=["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name="folioAgent"
module-root="src"
