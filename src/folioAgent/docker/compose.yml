name: folio-agent
services:
  folioAgent:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio123
      POSTGRES_DB: folio
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
    postgres_data: